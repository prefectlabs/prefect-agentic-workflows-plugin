name: Evals

# Runs the behavioral evaluations in server/evals against the Prefect Cloud
# sandbox workspace. The `behavioral evals` check is required on main. It runs
# on every pull request so the check always reports, and finishes at once
# when the pull request changes nothing under skills/ or server/.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the agent. Leave empty for claude-haiku-5-5."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: behavioral evals
    # Pull requests from forks don't get the repository's secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    env:
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_MODEL: ${{ inputs.model || 'claude-haiku-5-5' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for skill or server changes
        id: changes
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" \
              | grep -qE '^(skills/|server/|tests/fixtures/skills/|\.github/workflows/evals\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes under skills/ or server/, so the evals didn't run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install uv
        if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"
          python-version: "3.13"

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: uv sync --locked

      - name: Run the evals
        if: steps.changes.outputs.run == 'true'
        run: >-
          uv run --locked python -m evals
          --model "$AGENT_MODEL"
          --repeat 3
          --output-dir "$RUNNER_TEMP/evals"
          --summary "$RUNNER_TEMP/eval-report.md"

      - name: Write the report to the job summary
        if: always() && steps.changes.outputs.run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/eval-report.md" ]; then
            cat "$RUNNER_TEMP/eval-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The evals wrote no report. Read the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the transcripts
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-transcripts
          path: |
            ${{ runner.temp }}/evals/**/transcript.json
            ${{ runner.temp }}/evals/**/agent/**/workflows/*.plan.json
            ${{ runner.temp }}/eval-report.md
          if-no-files-found: ignore
          retention-days: 14
