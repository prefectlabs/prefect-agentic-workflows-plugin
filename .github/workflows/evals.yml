name: Evals

# Runs the behavioral evaluations in server/evals against the Prefect Cloud
# sandbox workspace. The job doesn't block a pull request while the pass
# rates settle.

on:
  pull_request:
    paths:
      - "skills/**"
      - "server/**"
      - ".github/workflows/evals.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the agent. Leave empty for claude-haiku-5-5."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: behavioral evals
    # Pull requests from forks don't get the repository's secrets.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    env:
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_MODEL: ${{ inputs.model || 'claude-haiku-5-5' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the evals
        run: >-
          uv run --locked pytest evals
          --agent-model "$AGENT_MODEL"
          --basetemp "$RUNNER_TEMP/evals"
          --pass-rate-file "$RUNNER_TEMP/pass-rate.md"

      - name: Write the pass rates to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pass-rate.md" ]; then
            cat "$RUNNER_TEMP/pass-rate.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The evals wrote no pass rates. Read the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-transcripts
          path: |
            ${{ runner.temp }}/evals/**/transcript.json
            ${{ runner.temp }}/evals/**/agent/workflows/
          if-no-files-found: ignore
          retention-days: 14
